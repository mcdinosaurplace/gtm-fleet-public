    roles: [Staff Platform Engineer, Site Reliability Engineer, SRE Lead, Head of Platform, Infrastructure Engineer]
    stage: Series B through growth
    team_size: 50–500 engineers
    geography: Mostly US-based; engineering across two or three time zones
    budget_owner: Technical champion — recommends, VP Engineering signs
    motivation: On-call is infrastructure and belongs in version control. Reads the provider docs before booking a demo.
    tone_priority: Educational confidence
    language_style: Technical, systems-led, never gatekeeping
    emotion: Respectful of his expertise
    humor_level: A–B
    channel_tones:
      product_help_docs: A
      guides_resources: A–B
      blog_articles: B
      social_linkedin: B
      internal: A
    discovery_channels: [Hacker News, SRE and platform-engineering Slacks, r/sre, GitHub, provider changelogs, "LinkedIn #PlatformEngineering"]

  erin_the_technical_founder:
