  HUBSPOT_STAGE_ID_6: "900000106"
  HUBSPOT_STAGE_ID_7: "900000107"
  HUBSPOT_WORKFLOW_ID_1: "900001001"
  HUBSPOT_WORKFLOW_ID_2: "900001002"
  HUBSPOT_WORKFLOW_ID_3: "900001003"
  HUBSPOT_DASHBOARD_ID: "1"
