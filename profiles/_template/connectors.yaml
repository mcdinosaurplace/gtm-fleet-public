  HUBSPOT_PIPELINE_ID: "90000001"
  HUBSPOT_STAGE_DISCOVERY_ID: "900000101"
  HUBSPOT_STAGE_CLOSED_WON_ID: "900000102"
  HUBSPOT_STAGE_CLOSED_LOST_ID: "900000103"
