# profiles/<name>/connectors.yaml — live-system identifiers, one per token.
#
# These are the ids the agents' Runtime Configuration tables read. In the base
# kit they appear as {{TOKENS}} in prompts and docs; the renderer substitutes
# them. None of the example values point anywhere real. Connector *categories*
# (~~crm, ~~chat, ~~issue tracker, ...) are documented in CONNECTORS.md; the
# MCP servers that back them are configured in mcp/connectors.example.json.

tokens:
  # ---- ~~chat (Slack) ----
  SLACK_WORKSPACE_HOST: example.slack.com
  # team channel + member ids live in state/identity/scribe-pm-cadence.yaml (format-validated)

  # ---- ~~issue tracker (Linear) ----
  LINEAR_WORKSPACE_SLUG: example
  LINEAR_TEAM_ID: 00000000-0000-4000-8000-000000000401

  # ---- ~~knowledge base (Notion) ----
  NOTION_WORKSPACE_SLUG: example
  NOTION_UPDATES_DB_ID: 00000000-0000-4000-8000-000000000101          # WBR "Updates" database
  NOTION_INTEL_BRIEFS_DB_ID: 00000000-0000-4000-8000-000000000102     # chief-of-staff briefs database
  NOTION_DM_BRIEFS_DB_ID: 00000000-0000-4000-8000-000000000103        # paid-media briefs database
  NOTION_TOPIC_BACKLOG_DB_ID: 00000000-0000-4000-8000-000000000104    # content topic review database
  NOTION_DEPT_MARKETING_PAGE_ID: "00000000000000000000000000000201"   # "Marketing" department relation page
  NOTION_BUSINESS_REVIEW_PAGE_ID: "00000000000000000000000000000202"  # "Business Review" relation page
  NOTION_DM_OPTIMIZATION_PAGE_ID: "00000000000000000000000000000203"
  NOTION_TOPIC_BACKLOG_PAGE_ID: "00000000000000000000000000000204"
  NOTION_CONTENT_ENGINE_PAGE_ID: "00000000000000000000000000000205"
  NOTION_BRIEFS_PARENT_PAGE_ID: "00000000000000000000000000000206"
  NOTION_PAGE_ID: "00000000000000000000000000000299"                  # generic example page id in docs
  NOTION_COLLECTION_ID: 00000000-0000-4000-8000-000000000199          # generic example collection id
  NOTION_USER_ID_HEAD_OF_MARKETING: 00000000-0000-4000-8000-000000000301
  NOTION_USER_ID_CONTENT_LEAD: 00000000-0000-4000-8000-000000000302

  # ---- ~~crm (HubSpot) ----
