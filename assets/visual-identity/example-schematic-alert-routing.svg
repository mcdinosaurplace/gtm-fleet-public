<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Schematic flow: 48 correlated signals from checkout-api are grouped into one incident, the owning service and rotation are resolved from the Ownership Graph, and a single page is acknowledged in 47 seconds." font-family="Inter, -apple-system, sans-serif">
  <defs>
    <pattern id="ar-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#E4E4E1"/>
    </pattern>
    <marker id="ar-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0.5,1 L8.5,5 L0.5,9" fill="none" stroke="#A8A69E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#F9FAF9"/>
  <rect width="1200" height="800" fill="url(#ar-dots)"/>

  <!-- header -->
  <text x="48" y="38" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#6C6C66">{{COMPANY}} · SCHEMATIC FLOW · 01</text>
  <text x="48" y="70" font-size="26" font-weight="600" letter-spacing="-0.7" fill="#282823">48 signals. <tspan fill="#0F766E">One page.</tspan></text>
  <text x="48" y="94" font-size="14" fill="#6C6C66">Signal Grouping correlates the noise, the Ownership Graph resolves the owner, one rotation gets paged.</text>
  <line x1="48" y1="112" x2="1152" y2="112" stroke="#E4E4E1"/>

  <!-- 01 signals received (neutral event) -->
  <text x="268" y="161" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#A8A69E" text-anchor="end">01</text>
  <rect x="300" y="136" width="600" height="140" rx="10" fill="#FFFFFF" stroke="#E4E4E1"/>
  <path d="M300,174 L300,146 A10,10 0 0 1 310,136 L890,136 A10,10 0 0 1 900,146 L900,174 Z" fill="#E5F6FF"/>
  <line x1="300" y1="174" x2="900" y2="174" stroke="#E4E4E1"/>
  <text x="318" y="161" font-size="13" font-weight="600" fill="#282823">Signals received</text>
  <text x="882" y="161" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#5C6670" text-anchor="end">90s window</text>
  <text x="318" y="200" font-size="13" fill="#282823">checkout-api — p99 latency above 900 ms</text>
  <text x="882" y="200" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#5C6670" text-anchor="end">×34</text>
  <text x="318" y="224" font-size="13" fill="#282823">checkout-api — 5xx rate burning the error budget</text>
  <text x="882" y="224" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#5C6670" text-anchor="end">×11</text>
  <rect x="318" y="237" width="188" height="22" rx="11" fill="#E5F6FF" stroke="#0099FF"/>
  <text x="412" y="252" font-size="12" font-weight="600" fill="#0060E6" text-anchor="middle">48 raw signals, 3 emitters</text>
  <text x="930" y="153" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6C6C66">Every emitter fires on<tspan x="930" dy="16">its own. The noise is</tspan><tspan x="930" dy="16">the problem, not the</tspan><tspan x="930" dy="16">incident.</tspan></text>

  <line x1="600" y1="278" x2="600" y2="306" stroke="#A8A69E" stroke-width="1.25" marker-end="url(#ar-arrow)"/>
  <text x="614" y="296" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6C6C66">correlate</text>

  <!-- 02 signal grouping -->
  <text x="268" y="333" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#A8A69E" text-anchor="end">02</text>
  <rect x="300" y="308" width="600" height="140" rx="10" fill="#FFFFFF" stroke="#E4E4E1"/>
  <path d="M300,346 L300,318 A10,10 0 0 1 310,308 L890,308 A10,10 0 0 1 900,318 L900,346 Z" fill="#D5EFEB"/>
  <line x1="300" y1="346" x2="900" y2="346" stroke="#E4E4E1"/>
  <text x="318" y="333" font-size="13" font-weight="600" fill="#13857C">Signal Grouping</text>
  <text x="882" y="333" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#5C6670" text-anchor="end">INC-2291</text>
  <text x="318" y="372" font-size="13" fill="#282823">Grouped by service and dependency edge, one 90s window</text>
  <text x="318" y="396" font-size="13" fill="#5C6670">48 signals → 1 incident — three emitters, one cause</text>
  <rect x="318" y="409" width="134" height="22" rx="11" fill="#F2FFE6" stroke="#2D8A36"/>
  <text x="385" y="424" font-size="12" font-weight="600" fill="#2D8A36" text-anchor="middle">✓ Deduplicated</text>
  <rect x="462" y="409" width="150" height="22" rx="11" fill="#FFFFFF" stroke="#E4E4E1"/>
  <text x="537" y="424" font-size="12" font-weight="600" fill="#6C6C66" text-anchor="middle">47 pages suppressed</text>
  <text x="930" y="325" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6C6C66">One incident record,<tspan x="930" dy="16">not 48 alerts. The</tspan><tspan x="930" dy="16">suppressed signals stay</tspan><tspan x="930" dy="16">on the incident.</tspan></text>

  <line x1="600" y1="450" x2="600" y2="478" stroke="#A8A69E" stroke-width="1.25" marker-end="url(#ar-arrow)"/>
  <text x="614" y="468" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6C6C66">resolve owner</text>

  <!-- 03 ownership graph -->
  <text x="268" y="505" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#A8A69E" text-anchor="end">03</text>
  <rect x="300" y="480" width="600" height="140" rx="10" fill="#FFFFFF" stroke="#E4E4E1"/>
  <path d="M300,518 L300,490 A10,10 0 0 1 310,480 L890,480 A10,10 0 0 1 900,490 L900,518 Z" fill="#D5EFEB"/>
  <line x1="300" y1="518" x2="900" y2="518" stroke="#E4E4E1"/>
  <text x="318" y="505" font-size="13" font-weight="600" fill="#13857C">Ownership Graph</text>
  <text x="882" y="505" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#5C6670" text-anchor="end">resolved in 120 ms</text>
  <text x="318" y="544" font-size="13" fill="#282823">checkout-api → Payments Platform → rotation payments-primary</text>
  <text x="318" y="568" font-size="13" fill="#5C6670">Escalation policy payments-p1 — ownership as code, synced from the Terraform provider</text>
  <rect x="318" y="581" width="146" height="22" rx="11" fill="#F2FFE6" stroke="#2D8A36"/>
  <text x="391" y="596" font-size="12" font-weight="600" fill="#2D8A36" text-anchor="middle">✓ Owner resolved</text>
  <rect x="474" y="581" width="126" height="22" rx="11" fill="#FFFFFF" stroke="#E4E4E1"/>
  <text x="537" y="596" font-size="12" font-weight="600" fill="#6C6C66" text-anchor="middle">0 human routing</text>
  <text x="930" y="497" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6C6C66">Ownership lives in the<tspan x="930" dy="16">repo, so routing never</tspan><tspan x="930" dy="16">goes stale when a team</tspan><tspan x="930" dy="16">splits a service.</tspan></text>

  <line x1="600" y1="622" x2="600" y2="650" stroke="#A8A69E" stroke-width="1.25" marker-end="url(#ar-arrow)"/>
  <text x="614" y="640" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6C6C66">page</text>

  <!-- 04 paged (success) -->
  <text x="268" y="677" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#A8A69E" text-anchor="end">04</text>
  <rect x="300" y="652" width="600" height="112" rx="10" fill="#FFFFFF" stroke="#E4E4E1"/>
  <path d="M300,690 L300,662 A10,10 0 0 1 310,652 L890,652 A10,10 0 0 1 900,662 L900,690 Z" fill="#F2FFE6"/>
  <line x1="300" y1="690" x2="900" y2="690" stroke="#E4E4E1"/>
  <text x="318" y="677" font-size="13" font-weight="600" fill="#282823">One page delivered</text>
  <text x="882" y="677" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#5C6670" text-anchor="end">MTTA 47s</text>
  <text x="318" y="716" font-size="13" fill="#282823">payments-primary — Soren V. on shift, acknowledged from the mobile app</text>
  <rect x="318" y="729" width="134" height="22" rx="11" fill="#F2FFE6" stroke="#2D8A36"/>
  <text x="385" y="744" font-size="12" font-weight="600" fill="#2D8A36" text-anchor="middle">✓ Acknowledged</text>
  <rect x="462" y="729" width="218" height="22" rx="11" fill="#FFFFFF" stroke="#E4E4E1"/>
  <text x="571" y="744" font-size="12" font-weight="600" fill="#6C6C66" text-anchor="middle">11 other responders never woke up</text>
  <text x="930" y="669" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6C6C66">The win is the page<tspan x="930" dy="16">that never arrived, not</tspan><tspan x="930" dy="16">the dashboard nobody</tspan><tspan x="930" dy="16">opened.</tspan></text>

  <text x="48" y="786" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#A8A69E">white cards · 1px #E4E4E1 · 10px radius · header tint keyed to status · a pill on every state change · reads top to bottom</text>
</svg>
