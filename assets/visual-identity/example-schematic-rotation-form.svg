<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Product mockup: the Rotation Studio form for the payments-primary rotation, showing services covered, handoff, shift length, four responders and quiet hours, with pre-publish checks that pass except a fourteen-hour coverage gap at the week three handoff, which blocks publishing." font-family="Inter, -apple-system, sans-serif">
  <defs>
    <pattern id="rf-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#E4E4E1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#F9FAF9"/>
  <rect width="1200" height="800" fill="url(#rf-dots)"/>

  <!-- header -->
  <text x="48" y="38" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#6C6C66">{{COMPANY}} · PRODUCT MOCKUP · 04</text>
  <text x="48" y="70" font-size="26" font-weight="600" letter-spacing="-0.7" fill="#282823">A rotation you can read <tspan fill="#0F766E">in one screen.</tspan></text>
  <text x="48" y="94" font-size="14" fill="#6C6C66">Rotation Studio — every field checked as you type, and a coverage check that holds publish until the schedule is whole.</text>
  <line x1="48" y1="112" x2="1152" y2="112" stroke="#E4E4E1"/>

  <!-- window -->
  <rect x="270" y="136" width="660" height="630" rx="10" fill="#FFFFFF" stroke="#E4E4E1"/>
  <path d="M270,174 L270,146 A10,10 0 0 1 280,136 L920,136 A10,10 0 0 1 930,146 L930,174 Z" fill="#F9FAF9"/>
  <line x1="270" y1="174" x2="930" y2="174" stroke="#E4E4E1"/>
  <circle cx="294" cy="155" r="5" fill="#E4E4E1"/>
  <circle cx="312" cy="155" r="5" fill="#E4E4E1"/>
  <circle cx="330" cy="155" r="5" fill="#E4E4E1"/>
  <text x="600" y="159" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#5C6670" text-anchor="middle">Rotation Studio — new rotation</text>

  <text x="302" y="204" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#A8A69E">01 · SCHEDULE</text>

  <!-- rotation name -->
  <text x="302" y="228" font-size="12" fill="#5C6670">Rotation name</text>
  <rect x="302" y="236" width="376" height="34" rx="6" fill="#F9FAF9" stroke="#E4E4E1"/>
  <text x="316" y="258" font-size="13" fill="#282823">payments-primary</text>
  <rect x="694" y="242" width="88" height="22" rx="11" fill="#F2FFE6" stroke="#2D8A36"/>
  <text x="738" y="257" font-size="12" font-weight="600" fill="#2D8A36" text-anchor="middle">✓ Unique</text>

  <!-- services -->
  <text x="302" y="290" font-size="12" fill="#5C6670">Services covered</text>
  <rect x="302" y="298" width="376" height="34" rx="6" fill="#F9FAF9" stroke="#E4E4E1"/>
  <text x="316" y="320" font-size="13" fill="#282823">checkout-api, payments-gateway, ledger-svc</text>
  <rect x="694" y="304" width="158" height="22" rx="11" fill="#F2FFE6" stroke="#2D8A36"/>
  <text x="773" y="319" font-size="12" font-weight="600" fill="#2D8A36" text-anchor="middle">✓ 3 services mapped</text>

  <!-- handoff -->
  <text x="302" y="352" font-size="12" fill="#5C6670">Handoff</text>
  <rect x="302" y="360" width="376" height="34" rx="6" fill="#F9FAF9" stroke="#E4E4E1"/>
  <text x="316" y="382" font-size="13" fill="#282823">Mondays 09:00, in each responder's local time</text>
  <rect x="694" y="366" width="116" height="22" rx="11" fill="#F2FFE6" stroke="#2D8A36"/>
  <text x="752" y="381" font-size="12" font-weight="600" fill="#2D8A36" text-anchor="middle">✓ No overlap</text>

  <!-- shift length -->
  <text x="302" y="414" font-size="12" fill="#5C6670">Shift length</text>
  <rect x="302" y="422" width="376" height="34" rx="6" fill="#F9FAF9" stroke="#E4E4E1"/>
  <text x="316" y="444" font-size="13" fill="#282823">7 days · 4 responders · one shift in four</text>
  <rect x="694" y="428" width="188" height="22" rx="11" fill="#F2FFE6" stroke="#2D8A36"/>
  <text x="788" y="443" font-size="12" font-weight="600" fill="#2D8A36" text-anchor="middle">✓ Within fairness policy</text>

  <!-- responders -->
  <text x="302" y="476" font-size="12" fill="#5C6670">Responders</text>
  <rect x="302" y="484" width="88" height="30" rx="15" fill="#FFFFFF" stroke="#E4E4E1"/>
  <text x="346" y="504" font-size="13" fill="#282823" text-anchor="middle">Soren V.</text>
  <rect x="398" y="484" width="82" height="30" rx="15" fill="#FFFFFF" stroke="#E4E4E1"/>
  <text x="439" y="504" font-size="13" fill="#282823" text-anchor="middle">Yuki A.</text>
  <rect x="488" y="484" width="84" height="30" rx="15" fill="#FFFFFF" stroke="#E4E4E1"/>
  <text x="530" y="504" font-size="13" fill="#282823" text-anchor="middle">Zoya M.</text>
  <rect x="580" y="484" width="94" height="30" rx="15" fill="#FFFFFF" stroke="#E4E4E1"/>
  <text x="627" y="504" font-size="13" fill="#282823" text-anchor="middle">Anders K.</text>
  <rect x="694" y="490" width="154" height="22" rx="11" fill="#F2FFE6" stroke="#2D8A36"/>
  <text x="771" y="505" font-size="12" font-weight="600" fill="#2D8A36" text-anchor="middle">✓ All four accepted</text>

  <!-- quiet hours -->
  <text x="302" y="538" font-size="12" fill="#5C6670">Quiet hours</text>
  <rect x="302" y="546" width="376" height="34" rx="6" fill="#F9FAF9" stroke="#E4E4E1"/>
  <text x="316" y="568" font-size="13" fill="#282823">22:00–07:00 local → follow-the-sun partner</text>
  <rect x="694" y="552" width="98" height="22" rx="11" fill="#F2FFE6" stroke="#2D8A36"/>
  <text x="743" y="567" font-size="12" font-weight="600" fill="#2D8A36" text-anchor="middle">✓ Covered</text>

  <line x1="302" y1="606" x2="898" y2="606" stroke="#E4E4E1"/>
  <text x="302" y="628" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#A8A69E">02 · PRE-PUBLISH CHECKS</text>

  <rect x="302" y="638" width="242" height="22" rx="11" fill="#FFE8E6" stroke="#A11E12"/>
  <text x="423" y="653" font-size="12" font-weight="600" fill="#A11E12" text-anchor="middle">✕ 14h gap at the week-3 handoff</text>
  <rect x="556" y="638" width="221" height="22" rx="11" fill="#F2FFE6" stroke="#2D8A36"/>
  <text x="667" y="653" font-size="12" font-weight="600" fill="#2D8A36" text-anchor="middle">✓ Every service has an owner</text>
  <rect x="302" y="668" width="249" height="22" rx="11" fill="#F2FFE6" stroke="#2D8A36"/>
  <text x="427" y="683" font-size="12" font-weight="600" fill="#2D8A36" text-anchor="middle">✓ No responder over one shift in four</text>
  <rect x="563" y="668" width="290" height="22" rx="11" fill="#FFFFFF" stroke="#E4E4E1"/>
  <text x="708" y="683" font-size="12" font-weight="600" fill="#6C6C66" text-anchor="middle">Fairness Report — night pages 3 / 2 / 3 / 2</text>

  <line x1="302" y1="708" x2="898" y2="708" stroke="#E4E4E1"/>
  <rect x="302" y="720" width="170" height="30" rx="6" fill="#E4E4E1"/>
  <text x="387" y="740" font-size="15" font-weight="700" fill="#A8A69E" text-anchor="middle">Publish rotation</text>
  <rect x="482" y="720" width="170" height="30" rx="6" fill="none" stroke="#282823"/>
  <text x="567" y="740" font-size="15" font-weight="700" fill="#282823" text-anchor="middle">Preview 8 weeks</text>
  <text x="898" y="740" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#A8A69E" text-anchor="end">the gap holds publish</text>

  <!-- annotations -->
  <text x="960" y="232" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6C6C66">Services are the unit<tspan x="960" dy="16">of ownership. A</tspan><tspan x="960" dy="16">rotation covers</tspan><tspan x="960" dy="16">services, not people.</tspan></text>
  <text x="960" y="418" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6C6C66">Fairness is a field you<tspan x="960" dy="16">fill in, not a number</tspan><tspan x="960" dy="16">you reconcile later.</tspan></text>
  <text x="960" y="644" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6C6C66">A schedule with a hole<tspan x="960" dy="16">in it is not a schedule,</tspan><tspan x="960" dy="16">so the form says so</tspan><tspan x="960" dy="16">before anyone is paged.</tspan></text>

  <text x="48" y="790" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#A8A69E">product mockup: macOS window chrome · #F9FAF9 inputs on white · validation pills beside the field they judge · primary button stays disabled while a check fails</text>
</svg>
