<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 880" font-family="Inter, -apple-system, sans-serif">
  <rect width="1120" height="880" fill="#F9FAF9"/>
  <text x="40" y="52" font-size="22" font-weight="600" fill="#282823">{{COMPANY}} type scale</text>
  <text x="40" y="76" font-size="12" font-family="'IBM Plex Mono', monospace" fill="#6C6C66">Inter SemiBold for all headings · desktop sizes from {{COMPANY_DOMAIN}} presets · renders in the system sans-serif if Inter is not installed</text>

  <line x1="40" y1="100" x2="1080" y2="100" stroke="#E4E4E1"/>

  <!-- display -->
  <text x="40" y="124" font-size="11" font-family="'IBM Plex Mono', monospace" fill="#6C6C66">DISPLAY · 160px/0.9 · -0.03em · shown at 50%</text>
  <text x="40" y="200" font-size="80" font-weight="600" letter-spacing="-2.4" fill="#282823">Reliability, <tspan fill="#BCBAB3">not heroics.</tspan></text>
  <text x="40" y="228" font-size="11" font-family="'IBM Plex Mono', monospace" fill="#A8A69E">two-tone emphasis, muted variant: one phrase in #BCBAB3</text>

  <line x1="40" y1="252" x2="1080" y2="252" stroke="#E4E4E1"/>

  <!-- h1 -->
  <text x="40" y="276" font-size="11" font-family="'IBM Plex Mono', monospace" fill="#6C6C66">H1 · 56-60px/64 · -0.04em</text>
  <text x="40" y="336" font-size="56" font-weight="600" letter-spacing="-2.2" fill="#282823">The pages stop arriving.</text>

  <line x1="40" y1="364" x2="1080" y2="364" stroke="#E4E4E1"/>

  <!-- h2 -->
  <text x="40" y="388" font-size="11" font-family="'IBM Plex Mono', monospace" fill="#6C6C66">H2 · 40-48px/56 · -0.021em</text>
  <text x="40" y="440" font-size="48" font-weight="600" letter-spacing="-1.0" fill="#282823"><tspan fill="#0F766E">Ownership</tspan> is infrastructure.</text>
  <text x="40" y="466" font-size="11" font-family="'IBM Plex Mono', monospace" fill="#A8A69E">two-tone emphasis, brand variant: one phrase in #0F766E</text>

  <line x1="40" y1="490" x2="1080" y2="490" stroke="#E4E4E1"/>

  <!-- h3 / h4 -->
  <text x="40" y="514" font-size="11" font-family="'IBM Plex Mono', monospace" fill="#6C6C66">H3 · 32px/40 · -0.04em</text>
  <text x="40" y="552" font-size="32" font-weight="600" letter-spacing="-1.28" fill="#282823">Incident response that routes itself.</text>
  <text x="40" y="586" font-size="11" font-family="'IBM Plex Mono', monospace" fill="#6C6C66">H4 · 24px/32 · -0.02em</text>
  <text x="40" y="618" font-size="24" font-weight="600" letter-spacing="-0.48" fill="#282823">One rotation for every service you own</text>

  <line x1="40" y1="642" x2="1080" y2="642" stroke="#E4E4E1"/>

  <!-- body -->
  <text x="40" y="666" font-size="11" font-family="'IBM Plex Mono', monospace" fill="#6C6C66">BODY · Inter Regular 18px/26 · 0em</text>
  <text x="40" y="696" font-size="18" fill="#464641">Route pages to owners automatically, or require a human handoff. Your call.</text>
  <text x="40" y="726" font-size="11" font-family="'IBM Plex Mono', monospace" fill="#6C6C66">BODY SMALL · Inter 400 15px/24 · captions and UI text use #6C6C66</text>
  <text x="40" y="752" font-size="15" font-family="Inter, -apple-system, sans-serif" fill="#6C6C66">API, CLI, Terraform provider, and sandbox access included on every plan.</text>

  <line x1="40" y1="776" x2="1080" y2="776" stroke="#E4E4E1"/>

  <!-- labels -->
  <text x="40" y="800" font-size="11" font-family="'IBM Plex Mono', monospace" fill="#6C6C66">MONO EYEBROW · IBM Plex Mono / Fragment Mono 12-14px · section numbering</text>
  <text x="40" y="826" font-size="13" font-family="'IBM Plex Mono', monospace" fill="#575751">05 · Now in beta</text>
  <rect x="220" y="806" width="170" height="30" rx="6" fill="#0F766E"/>
  <text x="305" y="826" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Start free</text>
  <rect x="406" y="806" width="170" height="30" rx="6" fill="none" stroke="#282823"/>
  <text x="491" y="826" font-size="15" font-weight="700" fill="#282823" text-anchor="middle">Book a demo</text>
  <text x="600" y="826" font-size="11" font-family="'IBM Plex Mono', monospace" fill="#A8A69E">buttons: Inter Bold 15-19px · 6-8px radius · never pills</text>

  <text x="40" y="864" font-size="12" fill="#6C6C66">Conventions: sentence case · declaratives end with a period · letter-spacing tightens as size grows · no italics, no all-caps headlines.</text>
</svg>
